<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <svg width="400" height="200" viewBox="0 0 300 120">

            <path
            class="signature"
            pathlength="1"
            d="M10,80 C60,10 120,120 180,40 S260,10 290,60"
            fill="none"
            stroke="white"
            stroke-width="4"
            >

            </path>

        </svg>
        <svg width="400" height="200" viewBox="0 0 400 150">
            <path
            id="track"
            d="M10,120 C120,-20 280,320 290,30"
            fill="none"
            stroke="#ddd"
            stroke-width="2"
            >
        </path>
        <circle class="ball" r="10" fill="#e17055"/>

        </svg>
    </div>
</body>
</html>
